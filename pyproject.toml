[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "creditlens"
version = "0.2.0"
description = "CreditLens AI: draft credit memos for SME loan applications at Good Bank, with a human underwriter in the loop"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "pandera>=0.20",
  "faker>=24",
  "reportlab>=4.0",
  "matplotlib>=3.8",
  "pillow>=10",
  "pypdfium2>=4",
  "sqlalchemy>=2.0",
  "pyyaml>=6",
  "pydantic>=2.6",
  "requests>=2.31",
]

[project.optional-dependencies]
# One extra per milestone so a laptop installs only what the day needs.
llm = ["litellm>=1.50", "langfuse>=3.0"]
realdata = ["datasets>=2.19", "kagglehub>=0.3", "python-docx>=1.1"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "python-jose[cryptography]>=3.3", "httpx>=0.27"]
extraction = ["pypdf>=4", "pdfplumber>=0.11", "pytesseract>=0.3", "rapidocr-onnxruntime>=1.3"]
retrieval = ["sentence-transformers>=3", "rank-bm25>=0.2", "qdrant-client>=1.9", "neo4j>=5", "networkx>=3"]
colpali = ["byaldi>=0.0.7"]
agents = ["langgraph>=0.2", "langchain-core>=0.3", "mcp>=1.0"]
integrations = ["zeep>=4.2", "spyne>=2.14", "oracledb>=2", "slack-bolt>=1.18"]
ml = ["scikit-learn>=1.4", "xgboost>=2", "mlflow>=2.12", "joblib>=1.3", "evidently>=0.4"]
security = ["presidio-analyzer>=2.2", "presidio-anonymizer>=2.2", "nemoguardrails>=0.9"]
evals = ["ragas>=0.2"]
mssql = ["pyodbc>=5"]
ui = ["streamlit>=1.40"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.4"]
all = [
  "creditlens[llm,realdata,api,extraction,retrieval,agents,integrations,ml,security,evals,ui,dev]",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
creditlens = ["**/*.yaml", "**/*.yml", "**/*.sql", "**/*.co", "**/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
markers = [
  "needs_llm: requires an LLM API key",
  "needs_service: requires Docker or a cloud service",
  "slow: downloads a model or takes more than a minute",
]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
# Pin the rule set explicitly. Without this, `ruff check` uses whatever its default
# happens to be in the version each person installed, so CI and a laptop disagree
# about what "clean" means. These are the pycodestyle and pyflakes rules that catch
# real mistakes (undefined names, unused imports, broken syntax) rather than style
# opinions, which is the right level for a teaching repository.
select = ["E4", "E7", "E9", "F"]
